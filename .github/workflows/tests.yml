name: tests

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The same Node as local runs: the suite needs node:sqlite and the
      # bundled acorn (ES5 check), both present in 24.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node tests/run.js
